name: Keep Render Bot Awake

on:
  schedule:
    # Every 10 minutes, offset from the exact hour to reduce scheduler congestion.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 https://mlbb-market-bot.onrender.com/health > /dev/null
          echo "Render keepalive ping: OK"
